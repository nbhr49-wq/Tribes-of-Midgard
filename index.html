<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050806">
<title>TRIBES OF MIDGARD — 古の記録</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="site">

  <!-- 1枚目：森の遺跡 -->
  <section id="scene1" class="scene active">
    <img src="scene-01.png" class="scene-image" alt="森の中の古い石板">
    <button id="touchTablet" class="touch-area" aria-label="石板に触れる"></button>
  </section>

  <!-- 2枚目：苔むした石板 -->
  <section id="scene2" class="scene tablet-scene">
    <img src="scene-02.png" class="scene-image" alt="苔むした石板">

    <!-- ここは画像ではなくHTML。JavaScriptで一行ずつ表示します -->
    <div id="storyText" class="story-text" aria-live="polite">

      <div class="story-line title">ここに英雄の名前を記す</div>
      <div class="story-line name">taro senpen しかご ダイブさん</div>

      <div class="story-line">我々はミッドガルドへ向かった。</div>
      <div class="story-line">世界樹を守るため。</div>
      <div class="story-line">巨人を討つため。</div>
      <div class="story-line last">そして――</div>

      <button id="playRecord" class="record-button">
        <span>▶</span>
        <span>記録映像を見る</span>
      </button>
    </div>
  </section>

  <!-- 動画 -->
  <section id="videoScene" class="video-scene">
    <div class="video-content">
      <div class="video-title">―― 記録映像 ――</div>
      <div class="video-wrapper">
        <iframe
          id="youtube"
          src="https://www.youtube.com/embed/tNP8YYhGLWg?rel=0&playsinline=1"
          title="Tribes of Midgard 記録映像"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </section>

  <div id="blackout"></div>
</main>

<script>
const scene1 = document.getElementById("scene1");
const scene2 = document.getElementById("scene2");
const storyText = document.getElementById("storyText");
const blackout = document.getElementById("blackout");
const videoScene = document.getElementById("videoScene");
const youtube = document.getElementById("youtube");

const lines = [...document.querySelectorAll(".story-line")];

function fadeTransition(callback) {
  blackout.classList.add("on");

  setTimeout(() => {
    callback();

    setTimeout(() => {
      blackout.classList.remove("on");
    }, 500);
  }, 850);
}

/*
  1枚目 → 2枚目
*/
document.getElementById("touchTablet").addEventListener("click", () => {

  fadeTransition(() => {
    scene1.classList.remove("active");
    scene2.classList.add("active");

    // 念のため毎回リセット
    storyText.classList.remove("started");
    lines.forEach(line => line.classList.remove("visible"));

    /*
      石板が表示されてから、
      本当にJavaScriptで一行ずつvisibleにする。
      CSS animationだけに依存しない方式。
    */
    setTimeout(() => {
      storyText.classList.add("started");

      lines.forEach((line, index) => {
        setTimeout(() => {
          line.classList.add("visible");
        }, 700 + index * 1050);
      });
    }, 700);
  });
});

/*
  2枚目 → 動画
*/
document.getElementById("playRecord").addEventListener("click", () => {

  blackout.classList.add("on");

  setTimeout(() => {
    videoScene.classList.add("visible");

    /*
      YouTube側にautoplayを要求。
      ブラウザの自動再生制限で止まる場合は
      YouTubeプレイヤーの再生ボタンを押せます。
    */
    const url = new URL(youtube.src);
    url.searchParams.set("autoplay", "1");
    youtube.src = url.toString();

    setTimeout(() => {
      blackout.classList.remove("on");
    }, 900);

  }, 1000);
});
</script>

</body>
</html>
