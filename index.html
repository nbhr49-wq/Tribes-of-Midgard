<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>古き記録 — Tribes of Midgard</title>
  <meta name="description" content="Tribes of Midgard プレイ記録">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="fog fog-a"></div>
  <div class="fog fog-b"></div>

  <main id="world">
    <section class="intro">
      <p class="eyebrow">TRIBES OF MIDGARD / MEMORY ARCHIVE</p>
      <h1>古き記録</h1>
      <p class="lead">森の奥に、忘れられた記録が残されている。</p>

      <button id="readTablet" class="tablet-button" type="button" aria-label="石板を読む">
        <span class="tablet">
          <span class="rune rune-1">ᛏ</span>
          <span class="rune rune-2">ᚱ</span>
          <span class="rune rune-3">ᚨ</span>
          <span class="tablet-title">記録</span>
          <span class="tablet-mark">ᛉ ᛟ ᚾ</span>
        </span>
        <span class="button-caption">石板を読む</span>
      </button>
    </section>

    <section id="record" class="record" aria-hidden="true">
      <div class="record-paper">
        <p class="record-label">ARCHIVE No. 001</p>
        <h2>ある冒険者たちの記録</h2>
        <p>
          深い森の中で、ひとつの石板が見つかった。<br>
          そこには、かつて世界樹へ挑んだ者たちの記録が刻まれている。
        </p>
        <p class="quote">「我々は、またこの夜を越える。」</p>
        <p class="record-small">―― 記録は、ここから先の映像に残されている。</p>
        <button id="playRecord" class="gold-button" type="button">
          記録映像を再生する
        </button>
      </div>
    </section>
  </main>

  <section id="cinema" class="cinema" aria-hidden="true">
    <div class="cinema-inner">
      <p class="cinema-label">ARCHIVE No. 001 / VIDEO RECORD</p>
      <div class="video-frame">
        <div id="player"></div>
      </div>
      <button id="backToTablet" class="back-button" type="button">記録へ戻る</button>
    </div>
  </section>

  <div id="blackout" class="blackout" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
