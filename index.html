<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050806">
  <title>TRIBES OF MIDGARD — 古の記録</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site">

    <!-- 1枚目：森の遺跡 -->
    <section id="scene1" class="scene scene1 active" aria-label="古の遺跡">
      <img src="scene-01.png" alt="森の中の古い石板" class="scene-image">

      <!-- 画像の「石板に触れる」部分をクリック領域にする -->
      <button
        id="touchTablet"
        class="click-area touch-tablet"
        aria-label="石板に触れる">
      </button>
    </section>

    <!-- 2枚目：苔むした石板 -->
    <section id="scene2" class="scene scene2" aria-hidden="true" aria-label="苔むした石板">
      <img src="scene-02.png" alt="苔むした石板と古代文字" class="scene-image">

      <!-- 文章は画像に焼き込まず、HTMLで演出 -->
      <div id="inscription" class="inscription">
        <p class="line line-title">ここに英雄の名前を記す</p>
        <p class="line line-name">taro senpen しかご ダイブさん</p>

        <div class="story">
          <p class="line">我々はミッドガルドへ向かった。</p>
          <p class="line">世界樹を守るため。</p>
          <p class="line">巨人を討つため。</p>
          <p class="line ending">そして――</p>
        </div>

        <button id="playRecord" class="record-button" type="button">
          <span class="triangle">▶</span>
          <span>記録映像を見る</span>
        </button>
      </div>
    </section>

    <!-- 動画 -->
    <section id="videoScene" class="video-scene" aria-hidden="true">
      <div class="video-frame">
        <div class="video-caption">―― 記録映像 ――</div>
        <div class="youtube-wrap">
          <iframe
            id="youtube"
            src="https://www.youtube.com/embed/tNP8YYhGLWg?rel=0&playsinline=1"
            title="Tribes of Midgard — 記録映像"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            allowfullscreen>
          </iframe>
        </div>
      </div>
    </section>

    <div id="blackout" class="blackout"></div>
  </main>

<script>
const scene1 = document.getElementById("scene1");
const scene2 = document.getElementById("scene2");
const videoScene = document.getElementById("videoScene");
const inscription = document.getElementById("inscription");
const blackout = document.getElementById("blackout");
const youtube = document.getElementById("youtube");

function transition(callback, duration = 900) {
  blackout.classList.add("show");
  window.setTimeout(() => {
    callback();
    window.setTimeout(() => blackout.classList.remove("show"), 450);
  }, duration);
}

document.getElementById("touchTablet").addEventListener("click", () => {
  transition(() => {
    scene1.classList.remove("active");
    scene1.setAttribute("aria-hidden", "true");

    scene2.classList.add("active");
    scene2.setAttribute("aria-hidden", "false");

    // 石板が表示されて少し経ってから文字が浮かび上がる
    window.setTimeout(() => {
      inscription.classList.add("reveal");
    }, 500);
  });
});

document.getElementById("playRecord").addEventListener("click", () => {
  blackout.classList.add("show");

  window.setTimeout(() => {
    videoScene.classList.add("show");
    videoScene.setAttribute("aria-hidden", "false");

    // YouTube IFrame APIを使わず、URLのautoplayで再生を要求。
    // ブラウザ側の自動再生制限により止まる場合は動画プレイヤーの再生ボタンを使用。
    const src = new URL(youtube.src);
    src.searchParams.set("autoplay", "1");
    src.searchParams.set("mute", "0");
    youtube.src = src.toString();

    window.setTimeout(() => blackout.classList.remove("show"), 800);
  }, 1000);
});
</script>
</body>
</html>
